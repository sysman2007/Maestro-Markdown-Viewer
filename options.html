<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>تنظیمات Maestro Markdown</title><link rel="stylesheet" href="options.css"></head><body><main><h1>تنظیمات Maestro Markdown Viewer</h1><p class="lead">فونت، اندازه، تم و چیدمان نمایش فایل‌های Markdown را انتخاب کنید.</p><section><label>فونت فارسی<select id="persianFont"><option value="IRANSansX">IranSans X</option><option value="IRANSans">IranSans</option><option value="Vazirmatn">Vazirmatn</option><option value="IRANYekanX">IranYekan X</option></select></label><label>فونت انگلیسی<select id="englishFont"><option value="Inter">Inter</option><option value="System">Standard system fonts</option></select></label><label>تم<select id="theme"><option value="auto">خودکار</option><option value="light">روشن</option><option value="dark">تیره</option></select></label><label>عرض محتوا <output id="maxWidthOut"></output><input id="maxWidth" type="range" min="720" max="1400" step="20"></label><label>اندازه متن <output id="fontSizeOut"></output><input id="fontSize" type="range" min="14" max="22"></label><label>فاصله خطوط فارسی <output id="lineHeightOut"></output><input id="lineHeight" type="range" min="1.6" max="2.3" step="0.05"></label><label class="check"><input id="showToc" type="checkbox"> نمایش فهرست مطالب</label></section><button id="save">ذخیره تنظیمات</button><span id="status"></span><div class="note"><strong>نکته نصب:</strong> پس از نصب، در صفحه مدیریت اکستنشن گزینه <b>Allow access to file URLs</b> را فعال کنید.</div></main><script src="options.js"></script></body></html>
